
name: Build portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --windowed --name FileHashGUI --collect-all pygost --collect-all Crypto --hidden-import=Crypto app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FileHashGUI-Windows-Portable
          path: dist/FileHashGUI.exe
